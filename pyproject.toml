[project]
name = "BoardPlayer"
version = "0.2dev"
requires-python = ">= 3.8"
authors = [
  {name = "Jeff Bradberry", email = "jeff.bradberry@gmail.com"},
]
description = "A generic board game player."
readme = "README.rst"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
]

[project.entry-points."jrb_board.games"]

[project.entry-points."jrb_board.players"]
human = "boardplayer.player:HumanPlayer"

[project.scripts]
board-play = "boardplayer.board_play:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["boardplayer"]
